---
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-mac:
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      MACOS_SIGNING_IDENTITY: "Developer ID Application: Mobile Reality sp. z o.o. (D8226MY2E7)"
    steps:
      - name: Refuse to sign outside a v* tag
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "Signing runs only from a v* tag, not from '$REF'. Start the workflow from the tag."; exit 1 ;;
          esac
          if [ -n "$TAG_INPUT" ] && [ "$TAG_INPUT" != "$REF_NAME" ]; then
            echo "The tag input '$TAG_INPUT' is not the tag the workflow runs from ('$REF_NAME')."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: pnpm run fuses

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/mac-ci-keychain.sh create

      - name: Sign the app
        run: bash scripts/mac-sign-notarize.sh sign

      - name: Notarize with notarytool and staple the ticket with stapler
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/mac-sign-notarize.sh notarize

      - name: Check the signature, the ticket and Gatekeeper
        run: bash scripts/mac-sign-notarize.sh verify

      - run: pnpm run pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lantern-mac
          path: dist/Lantern-mac.zip
          if-no-files-found: error

      - name: Delete the temporary keychain and key files
        if: always()
        run: bash scripts/mac-ci-keychain.sh delete

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:win

      - name: Zip the Windows build
        shell: pwsh
        run: tar.exe -a -c -f dist/Lantern-win-x64.zip -C dist Lantern-win32-x64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lantern-win-x64
          path: dist/Lantern-win-x64.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:linux

      - name: Zip the Linux build
        run: pnpm run pack:linux

      - name: Check the Linux package
        run: bash scripts/check-linux-package.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lantern-linux-x64
          path: dist/Lantern-linux-x64.zip
          if-no-files-found: error

  publish:
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Check the tag name
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "Tag '$TAG' does not start with v"; exit 1 ;;
          esac

      - name: Publish the Apple silicon build under the name the updater looks for
        run: |
          if [ ! -f release-assets/Lantern-mac.zip ]; then
            echo "release-assets/Lantern-mac.zip is missing, nothing to copy to Lantern-mac-arm64.zip"
            exit 1
          fi
          cp release-assets/Lantern-mac.zip release-assets/Lantern-mac-arm64.zip

      - name: Write the checksums of the packages
        run: bash scripts/release-checksums.sh release-assets

      - name: Create the release when it is missing
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

      - name: Upload the packages
        run: gh release upload "$TAG" release-assets/* --clobber
