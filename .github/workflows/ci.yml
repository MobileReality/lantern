name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm test

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANTERN_GRAPH_VISIBLE: "1"
      LANTERN_HARNESS_VISIBLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh apt index
        run: sudo apt-get update

      - name: Install the display server and Electron libraries
        run: sudo apt-get install -y --no-install-recommends xvfb libasound2t64 libgbm1 libgtk-3-0t64 libnss3 libxss1 libxtst6

      - name: Allow the Electron sandbox on Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Integrations e2e
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" pnpm run test:integrations:e2e

      - name: Tray e2e
        if: ${{ !cancelled() }}
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" pnpm run test:tray:e2e

      - name: Pull request host e2e
        if: ${{ !cancelled() }}
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" pnpm run test:pr-host:e2e

      - name: Skills e2e
        if: ${{ !cancelled() }}
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" pnpm run test:skills:e2e

      - name: Upload Playwright results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/playwright
          retention-days: 7
          if-no-files-found: ignore

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the unit tests with coverage
        run: pnpm coverage --coverage.reporter=text --coverage.reporter=html --coverage.reporter=json-summary

      - name: Write the coverage totals to the job summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          {
            echo "## Coverage"
            echo
            echo "| Metric | Covered | Total | Percent |"
            echo "|---|---|---|---|"
            jq -r '.total | del(.branchesTrue) | to_entries[] | "| \(.key) | \(.value.covered) | \(.value.total) | \(.value.pct)% |"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: pnpm run build:linux

      - name: Zip the Linux package and check what is in it
        if: runner.os == 'Linux'
        run: |
          pnpm run pack:linux
          names=$(zipinfo -1 dist/Lantern-linux-x64.zip)
          for entry in \
            Lantern-linux-x64/Lantern \
            Lantern-linux-x64/chrome-sandbox \
            Lantern-linux-x64/resources/app.asar \
            Lantern-linux-x64/resources/cli/lantern \
            Lantern-linux-x64/resources/lsp-runtime/node \
            Lantern-linux-x64/resources/licenses/ELECTRON-LICENSE \
            Lantern-linux-x64/resources/licenses/THIRD_PARTY_LICENSES.txt; do
            grep -Fx -- "$entry" <<< "$names" > /dev/null || { echo "Missing from Lantern-linux-x64.zip: $entry"; exit 1; }
          done
          for executable in Lantern-linux-x64/Lantern Lantern-linux-x64/resources/lsp-runtime/node; do
            zipinfo dist/Lantern-linux-x64.zip "$executable" | grep -q '^-rwx' || { echo "Not executable in Lantern-linux-x64.zip: $executable"; exit 1; }
          done
          pnpm exec electron-fuses read --app dist/Lantern-linux-x64/Lantern | grep -F 'RunAsNode is Disabled'

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: pnpm run dist:share

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: pnpm run build:win
